<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Hostel Complaint Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container wide">
    <div class="auth-card fade-up">
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-brand-logo">HC</div>
        <div class="auth-brand-text">
          <h2>Hostel Care</h2>
          <span>Student Registration</span>
        </div>
      </div>

      <div class="auth-header">
        <h1>Create Student Account</h1>
        <p>Register with your hostel and university credentials to report and track grievances</p>
      </div>

      <!-- Signup Form -->
      <form id="student-signup-form" novalidate>
        <div class="form-grid-2">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="signup-name">
              <span>Full Name</span>
              <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="signup-name" 
              class="form-control" 
              placeholder="e.g. John Doe" 
              required 
              autocomplete="name"
            >
          </div>

          <!-- USN -->
          <div class="form-group">
            <label class="form-label" for="signup-usn">
              <span>USN / Student ID</span>
              <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="signup-usn" 
              class="form-control" 
              placeholder="e.g. 1MS21CS042" 
              required 
              style="text-transform: uppercase;"
            >
          </div>
        </div>

        <div class="form-grid-2">
          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="signup-email">
              <span>Email Address</span>
              <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="signup-email" 
              class="form-control" 
              placeholder="student@university.edu" 
              required 
              autocomplete="email"
            >
          </div>

          <!-- Room Number -->
          <div class="form-group">
            <label class="form-label" for="signup-room">
              <span>Room Number</span>
              <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="signup-room" 
              class="form-control" 
              placeholder="e.g. Block B - 304" 
              required
            >
          </div>
        </div>

        <div class="form-grid-2">
          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="signup-password">
              <span>Password (min. 6 chars)</span>
              <span class="required">*</span>
            </label>
            <div class="password-input-wrap">
              <input 
                type="password" 
                id="signup-password" 
                class="form-control" 
                placeholder="••••••••" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle-btn" data-target="signup-password" aria-label="Toggle password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <!-- Strength Indicator -->
            <div id="strength-meter-wrap" class="strength-meter-wrap">
              <div class="strength-bars">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <div class="strength-text">
                <span id="strength-label-text">Password strength</span>
              </div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">
              <span>Confirm Password</span>
              <span class="required">*</span>
            </label>
            <div class="password-input-wrap">
              <input 
                type="password" 
                id="signup-confirm-password" 
                class="form-control" 
                placeholder="••••••••" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle-btn" data-target="signup-confirm-password" aria-label="Toggle password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-signup-submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">
          Create Student Account
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="auth-footer">
        Already registered? <a href="student-login.html">Sign In here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/student-auth.js"></script>
</body>
</html>
